spring:
  application:
    name: auth

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

ttarena:
  jwt:
    private-key: ${TTARENA_JWT_PRIVATE_KEY:classpath:keys/dev-private.pem}
    public-key: ${TTARENA_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}
    ttl-minutes: ${TTARENA_JWT_TTL_MINUTES:30}
  cors:
    allowed-origins: ${TTARENA_CORS_ORIGINS:http://localhost:3000}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  response-timeout: ${USER_SERVICE_TIMEOUT:5s}
  max-retries: ${USER_SERVICE_MAX_RETRIES:1}
  retry-backoff: ${USER_SERVICE_RETRY_BACKOFF:200ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
