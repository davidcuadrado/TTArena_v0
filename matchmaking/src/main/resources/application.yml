spring:
  application:
    name: matchmaking
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce queues a command while it reconnects rather than refusing it,
      # so with no Redis listening a call waits out the command timeout - 60
      # seconds by default, which outlives anything that would call it,
      # /actuator/health included.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

# Toggle for the Redis pub/sub wiring (publisher, template, subscriber).
redis:
  enabled: true

matchmaking:
  queue:
    entry-ttl-seconds: ${MATCHMAKING_QUEUE_TTL:120}

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

ttarena:
  jwt:
    public-key: ${TTARENA_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}
