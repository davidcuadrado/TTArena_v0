name: ttarena

x-service-base: &service-base
  restart: unless-stopped
  depends_on:
    mongo:
      condition: service_healthy
  networks:
    - ttarena

services:

  mongo:
    image: mongo:8.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ttarena

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ttarena

  auth:
    <<: *service-base
    build: ./auth
    depends_on:
      user:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      USER_SERVICE_BASE_URL: http://user:8081
      TTARENA_CORS_ORIGINS: ${TTARENA_CORS_ORIGINS:-http://localhost:3000}

  user:
    <<: *service-base
    build: ./user
    ports:
      - "8081:8081"
    environment:
      MONGODB_URI: mongodb://mongo:27017/user-db
      CHARACTER_SERVICE_BASE_URL: http://character:8083

  matchmaking:
    <<: *service-base
    build: ./matchmaking
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  character:
    <<: *service-base
    build: ./character
    ports:
      - "8083:8083"
    environment:
      MONGODB_URI: mongodb://mongo:27017/character-db

  game:
    <<: *service-base
    build: ./game
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      MONGODB_URI: mongodb://mongo:27017/game-db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHARACTER_SERVICE_BASE_URL: http://character:8083

  map:
    <<: *service-base
    build: ./map
    ports:
      - "8085:8085"
    environment:
      MONGODB_URI: mongodb://mongo:27017/map-db

  apisix:
    image: apache/apisix:3.11.0-debian
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      - auth
      - user
      - matchmaking
      - character
      - game
      - map
    networks:
      - ttarena

networks:
  ttarena:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
