spring:
  application:
    name: user
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/user-db}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

ttarena:
  jwt:
    public-key: ${TTARENA_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}
  cors:
    allowed-origins: ${TTARENA_CORS_ORIGINS:http://localhost:3000}

character-service:
  base-url: ${CHARACTER_SERVICE_BASE_URL:http://localhost:8083}
