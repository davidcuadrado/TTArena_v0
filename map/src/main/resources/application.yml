spring:
  application:
    name: map
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/map-db}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

ttarena:
  jwt:
    public-key: ${TTARENA_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}

map:
  max-radius: ${MAP_MAX_RADIUS:32}
  max-per-owner: ${MAP_MAX_PER_OWNER:50}
