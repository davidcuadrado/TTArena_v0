spring:
  application:
    name: game
  # Spring Boot 4 moved the Mongo CONNECTION properties out of
  # spring.data.mongodb into spring.mongodb. The old names are deprecated at
  # level=error, which means Boot does not bind them at all and does not
  # complain - every service silently fell back to mongodb://localhost/test.
  # auto-index-creation stays under spring.data.mongodb: it belongs to Spring
  # Data, not to the connection, and lives in a different module.
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/game-db}
  data:
    mongodb:
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce queues a command while it reconnects rather than refusing it,
      # so with no Redis listening a call waits out the command timeout - 60
      # seconds by default, which outlives anything that would call it,
      # /actuator/health included.
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

ttarena:
  jwt:
    public-key: ${TTARENA_JWT_PUBLIC_KEY:classpath:keys/dev-public.pem}

character-service:
  base-url: ${CHARACTER_SERVICE_BASE_URL:http://localhost:8083}
  response-timeout: ${CHARACTER_SERVICE_TIMEOUT:5s}

map-service:
  base-url: ${MAP_SERVICE_BASE_URL:http://localhost:8085}
  response-timeout: ${MAP_SERVICE_TIMEOUT:5s}

redis:
  enabled: true

game:
  turn:
    timeout-seconds: ${GAME_TURN_TIMEOUT:120}
  arena:
    # Blank means games are played without a board: no positions, no
    # movement, and no range checking.
    map-id: ${GAME_ARENA_MAP_ID:}
    movement-per-turn: ${GAME_MOVEMENT_PER_TURN:4}
