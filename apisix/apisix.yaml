# Declarative routes for the standalone data plane.
#
# The gateway routes and handles CORS. It deliberately does NOT verify JWTs:
# every service is an OAuth2 resource server that checks the RS256 signature
# itself, so a second check here would only be a second place to get wrong.

_cors: &cors
  cors:
    allow_origins: "*"
    allow_methods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allow_headers: "*"
    expose_headers: "*"
    max_age: 3600

routes:
  - id: auth
    uris:
      - "/auth/*"
    upstream_id: auth
    plugins: *cors

  - id: user
    uris:
      - "/user/*"
      - "/users/*"
    upstream_id: user
    plugins: *cors

  - id: matchmaking
    uris:
      - "/api/matchmaking/*"
    upstream_id: matchmaking
    plugins: *cors

  - id: character
    uris:
      - "/api/characters/*"
      - "/api/abilities/*"
    upstream_id: character
    plugins: *cors

  - id: game
    uris:
      - "/api/games/*"
    upstream_id: game
    plugins: *cors

  - id: map
    uris:
      - "/api/maps/*"
    upstream_id: map
    plugins: *cors

upstreams:
  - id: auth
    type: roundrobin
    nodes:
      "auth:8080": 1

  - id: user
    type: roundrobin
    nodes:
      "user:8081": 1

  - id: matchmaking
    type: roundrobin
    nodes:
      "matchmaking:8082": 1

  - id: character
    type: roundrobin
    nodes:
      "character:8083": 1

  - id: game
    type: roundrobin
    nodes:
      "game:8084": 1

  - id: map
    type: roundrobin
    nodes:
      "map:8085": 1

#END
